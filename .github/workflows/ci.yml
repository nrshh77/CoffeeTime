name: CoffeeTime Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання коду
        uses: actions/checkout@v7

      - name: Встановлення Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Встановлення залежностей
        run: npm ci

      - name: Запуск автоматичних тестів
        run: npm test